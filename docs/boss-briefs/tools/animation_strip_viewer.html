<!doctype html>
<html><head><meta charset="utf-8"><title>anim</title>
<style>body{margin:0;background:#161312}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {KTX2Loader} from 'three/addons/loaders/KTX2Loader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

// ?f=a,b (one row each) &clip=Attack &n=5 &cell=420 &ang=0,40,.. (degrees per column, optional) &out=name
const q = new URLSearchParams(location.search);
const files = (q.get('f') || '').split(',').filter(Boolean);
const clipName = (q.get('clip') || 'Idle').toLowerCase();
const clipList = (q.get('clips') || '').split(',').filter(Boolean).map(x => x.toLowerCase());
const n = +(q.get('n') || 5), cell = +(q.get('cell') || 420), out = q.get('out') || 'anim';
const angs = (q.get('ang') || '').split(',').filter(Boolean).map(Number);
const W = n * cell, H = files.length * cell;
const canvas = document.getElementById('c');
const r = new THREE.WebGLRenderer({canvas, antialias: true, preserveDrawingBuffer: true});
r.setPixelRatio(1); r.setSize(W, H); r.setScissorTest(true);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 2.2;
const envTex = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
const ktx2 = new KTX2Loader().setTranscoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/basis/').detectSupport(r);
const draco = new DRACOLoader().setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
const loader = new GLTFLoader().setKTX2Loader(ktx2).setMeshoptDecoder(MeshoptDecoder).setDRACOLoader(draco);
async function load(f) {
  for (let t = 0; t < 4; t++) { try { return await loader.loadAsync('m/' + f + '.glb'); } catch (e) { console.error('retry', f, String(e)); await new Promise(rs => setTimeout(rs, 400)); } }
  return null;
}
function bounds(root) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3();
  root.traverse(o => { if (!o.isMesh) return; if (o.isSkinnedMesh) { o.skeleton.update(); o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); } else { o.geometry.computeBoundingBox(); box.union(o.geometry.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
  return box;
}
const log = [];
for (let row = 0; row < files.length; row++) {
  const g = await load(files[row]);
  if (!g) { log.push(files[row] + ': load failed'); continue; }
  const cn = clipList[row] || clipName;
  const clip = g.animations.find(a => a.name.toLowerCase() === cn) || g.animations.find(a => a.name.toLowerCase().includes(cn));
  log.push(files[row] + ': ' + g.animations.length + ' clips, using ' + (clip && clip.name));
  const s = new THREE.Scene(); s.background = new THREE.Color(0x2b2522); s.environment = envTex;
  const m = g.scene; s.add(m);
  const mixer = new THREE.AnimationMixer(m);
  const act = clip ? mixer.clipAction(clip) : null; if (act) act.play();
  if (act) mixer.setTime(0);
  const box = bounds(m), sz = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const span = Math.max(sz.y, sz.x, sz.z);
  const d = span * 1.35 / Math.tan(THREE.MathUtils.degToRad(15));
  const cam = new THREE.PerspectiveCamera(30, 1, 0.01, 2000);
  s.add(new THREE.HemisphereLight(0xfff0e0, 0x403028, 2.2));
  const key = new THREE.DirectionalLight(0xffe0b0, 3.5); s.add(key);
  const rim = new THREE.DirectionalLight(0x99bbff, 1.8); s.add(rim);
  const dur = clip ? clip.duration : 0;
  for (let i = 0; i < n; i++) {
    if (act) mixer.setTime(dur * i / Math.max(n - 1, 1) * 0.999);
    const a = THREE.MathUtils.degToRad(angs.length ? (angs[i] ?? 0) : 20);
    cam.position.set(c.x + d * Math.sin(a), c.y + sz.y * 0.05, c.z + d * Math.cos(a)); cam.lookAt(c);
    key.position.set(c.x + d * Math.sin(a + 0.8), c.y + d, c.z + d * Math.cos(a + 0.8));
    rim.position.set(c.x + d * Math.sin(a - 2.4), c.y + d * 0.5, c.z + d * Math.cos(a - 2.4));
    const x = i * cell, y = H - (row + 1) * cell;
    r.setViewport(x, y, cell, cell); r.setScissor(x, y, cell, cell); r.render(s, cam);
  }
}
const blob = await new Promise(rs => canvas.toBlob(rs, 'image/png'));
await fetch('/save?name=' + out, {method: 'POST', body: blob});
document.title = 'saved ' + out + ' | ' + log.join(' ; ');
</script></body></html>
